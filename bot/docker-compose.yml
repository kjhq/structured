services:
  structured-bot:
    build: .
    container_name: structured-bot
    restart: unless-stopped
    env_file: .env
    # Needs network reachability to backend MCP_URL (host or compose service)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/structured-bot-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
