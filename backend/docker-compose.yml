services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: structured
      POSTGRES_PASSWORD: structured
      POSTGRES_DB: structured
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structured -d structured"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
