# Full stack: postgres (internal) + api REST (:8003 via proxy) + mcp (internal) + bot
services:
  postgres:
    image: postgres:16-alpine
    container_name: structured-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: structured
      POSTGRES_PASSWORD: structured
      POSTGRES_DB: structured
    volumes:
      - structured_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U structured -d structured"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Internal MCP-capable API — not published to the host.
  api:
    build: ./backend
    container_name: structured-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://structured:structured@postgres:5432/structured
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      BOT_API_SECRET: ${BOT_API_SECRET:?BOT_API_SECRET must be set}
      AUTHORIZED_DISCORD_IDS: ${AUTHORIZED_DISCORD_IDS:-}
      REQUIRE_SECURE_SECRETS: "true"
      ENABLE_MCP: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Public reverse proxy: TLS + /v1 only. MCP stays on the compose network.
  proxy:
    image: caddy:2-alpine
    container_name: structured-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:8003:8003"
      - "0.0.0.0:8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - structured_caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

  bot:
    build: ./bot
    container_name: structured-bot
    restart: unless-stopped
    env_file: ./bot/.env
    environment:
      MCP_URL: http://api:8000/mcp/mcp
      API_BASE_URL: http://api:8000
      BOT_API_SECRET: ${BOT_API_SECRET:?BOT_API_SECRET must be set}
      DATA_DIR: /app/data
      NOTIFY_POLL_MS: ${NOTIFY_POLL_MS:-20000}
    volumes:
      - structured_bot_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/structured-bot-ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  structured_postgres_data:
  structured_caddy_data:
  structured_bot_data:
